<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcraft Attendance</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text); line-height: 1.5; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--bg-card); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 1rem; }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .user-info { display: flex; align-items: center; gap: 1rem; }
    
    .btn { background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-weight: 500; font-size: 0.875rem; }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #475569; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }

    /* Tabs Styling */
    .tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; overflow-x: auto; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.75rem 1.25rem; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Grid Form Controls */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.375rem; }
    .form-group label { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    .form-control { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.625rem; border-radius: 0.375rem; width: 100%; font-size: 0.9rem; }
    select[multiple].form-control { height: 120px; }

    /* Responsive Tables */
    .table-responsive { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; text-align: left; font-size: 0.9rem; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--text-muted); font-weight: 600; }

    .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; }
    .badge-present { background: #166534; color: #4ade80; }
    .badge-absent { background: #991b1b; color: #fca5a5; }
    .toolbar { display:flex; gap:.75rem; flex-wrap:wrap; align-items:end; margin-bottom:1rem; }
    .toolbar .form-group { min-width:220px; flex:1; }
    .search-box { max-width:360px; }
    .muted { color:var(--text-muted); font-size:.85rem; }
    .empty { text-align:center; color:var(--text-muted); padding:1.25rem; }
    .btn-small { padding:.35rem .65rem; font-size:.8rem; }

    /* Auth screen */
    .auth-container { max-width: 400px; margin: 5rem auto; width: 90%; }

    @media (max-width: 640px) {
      .header { flex-direction: column; align-items: flex-start; }
      .container { padding: 1rem; }
      .card { padding: 1rem; }
    }
  </style>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --bg-main: #f4f7fb;
      --bg-card: #ffffff;
      --border: #dce5ef;
      --primary: #157a78;
      --primary-dark: #0f5f61;
      --accent: #e2f4f1;
      --text: #173b45;
      --text-muted: #6b7e91;
      --success: #12805c;
      --danger: #c83b4a;
      --shadow: 0 18px 45px rgba(18, 40, 61, .08);
    }

    html { background: var(--bg-main); }
    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at 85% -10%, rgba(21, 122, 120, .14), transparent 33rem),
        var(--bg-main);
      color: var(--text);
    }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 76px;
      padding: 1rem clamp(1rem, 4vw, 3.5rem);
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(18, 40, 61, .05);
      backdrop-filter: blur(16px);
    }
    .header h1 { color: var(--primary-dark); font-size: clamp(1.1rem, 2vw, 1.45rem); letter-spacing: -.04em; }
    .user-info { color: var(--text-muted); font-size: .9rem; }
    .user-info strong { color: var(--text); }
    .container { width: min(1240px, 100%); padding: 2rem clamp(1rem, 4vw, 3.5rem) 4rem; }
    .card {
      margin-bottom: 1.25rem;
      padding: clamp(1rem, 2.5vw, 1.75rem);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .tabs {
      gap: .25rem;
      margin: 0 0 1.5rem;
      padding: .35rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #eaf0f6;
      overflow-x: auto;
    }
    .tab-btn {
      border-radius: 8px;
      padding: .7rem 1rem;
      color: var(--text-muted);
      font-size: .88rem;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .tab-btn.active { color: var(--primary-dark); background: #fff; border-bottom: 0; box-shadow: 0 3px 10px rgba(18, 40, 61, .08); }
    .btn {
      min-height: 40px;
      padding: .62rem 1rem;
      border-radius: 8px;
      background: var(--primary);
      font-weight: 700;
      box-shadow: 0 6px 14px rgba(18, 100, 163, .18);
      transition: transform .2s ease, background .2s ease;
    }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-secondary { color: var(--primary-dark); background: var(--accent); box-shadow: none; }
    .btn-secondary:hover { background: #d6ebfb; }
    .btn-danger { background: var(--danger); box-shadow: 0 6px 14px rgba(200, 59, 74, .16); }
    .form-grid { gap: 1.15rem; }
    .form-group { gap: .45rem; }
    .form-group label { color: var(--text-muted); font-size: .78rem; letter-spacing: .02em; }
    .form-control {
      min-height: 42px;
      padding: .68rem .78rem;
      color: var(--text);
      background: #fbfdff;
      border: 1px solid #cbd8e5;
      border-radius: 8px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .form-control:focus { background: #fff; border-color: #4d9bd0; box-shadow: 0 0 0 3px rgba(77, 155, 208, .16); }
    table { margin-top: .75rem; font-size: .88rem; }
    th, td { padding: .85rem 1rem; border-bottom-color: #e6edf4; }
    th { color: var(--text-muted); background: #f5f8fb; font-size: .76rem; letter-spacing: .04em; text-transform: uppercase; }
    tbody tr:hover { background: #f8fbfe; }
    .badge { border-radius: 999px; padding: .28rem .65rem; }
    .badge-present { color: var(--success); background: #ddf6ec; }
    .badge-absent { color: var(--danger); background: #fde5e8; }
    .muted { color: var(--text-muted); }
    .toolbar { justify-content: space-between; gap: 1rem; }
    .toolbar h3 { margin-bottom: .2rem; font-size: 1.12rem; }
    .search-box { min-width: min(100%, 280px) !important; }
    .admin-main > .card > .toolbar { justify-content: flex-start; }
    .admin-main > .card > form { margin-top: 1rem; }
    .admin-main > .card > form > .btn { margin-top: .35rem; }
    #batch-editor select[multiple].form-control { height: 88px; min-height: 88px; }
    .admin-nav a.active { color: #173b45; background: #d8f2ed; box-shadow: inset 3px 0 #f3ad77; }
    .empty { padding: 2.5rem 1rem; }
    .auth-container {
      width: min(430px, calc(100% - 2rem));
      margin: clamp(2rem, 10vh, 7rem) auto;
      padding: clamp(1.5rem, 6vw, 2.5rem);
    }
    .auth-container:before { content: 'WEBCRAFT / ATTENDANCE'; display: block; margin-bottom: 1.5rem; color: var(--primary); font: 700 .72rem 'Space Grotesk', sans-serif; letter-spacing: .13em; }
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 15% 10%, #d8f2ef 0, transparent 35%), linear-gradient(135deg, #edf7f6, #f7f9fc 55%, #fff1e8); }
    .auth-container { margin: 0; border-color: #d5e5e4; box-shadow: 0 24px 70px rgba(35, 78, 91, .14); }
    .auth-container { animation: auth-enter .45s ease-out both; }
    @keyframes auth-enter { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .btn-loading { display: inline-flex; align-items: center; justify-content: center; gap: .55rem; cursor: wait; opacity: .82; }
    .spinner { width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-container h2 { color: #174b55; font-size: clamp(1.45rem, 4vw, 2rem); }
    .auth-container .btn { background: #157a78; box-shadow: 0 8px 18px rgba(21, 122, 120, .2); }
    .auth-container .btn:hover { background: #0f5f61; }
    .admin-intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .admin-kicker { color: #157a78; font: 700 .72rem 'Space Grotesk', sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .admin-section-title { display: flex; align-items: center; gap: .65rem; margin-bottom: .35rem; }
    .admin-section-title:before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #f28c5b; box-shadow: 0 0 0 5px #fff0e8; }
    .date-help { display: block; margin-top: .35rem; color: var(--text-muted); font-size: .76rem; }
    .admin-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1.25rem; align-items: start; }
    .admin-sidebar { position: sticky; top: 96px; padding: 1rem; background: #173b45; border-radius: 16px; box-shadow: 0 18px 40px rgba(23, 59, 69, .16); }
    .admin-sidebar-title { padding: .5rem .7rem 1rem; color: #b9e6df; font: 700 .7rem 'Space Grotesk', sans-serif; letter-spacing: .13em; text-transform: uppercase; }
    .admin-nav { display: grid; gap: .35rem; }
    .admin-nav a { display: flex; align-items: center; gap: .65rem; padding: .75rem .7rem; color: #d5ebe8; border-radius: 9px; text-decoration: none; font-weight: 700; font-size: .84rem; transition: background .2s ease, color .2s ease, transform .2s ease; }
    .admin-nav a:hover { color: #173b45; background: #d8f2ed; transform: translateX(2px); }
    .admin-nav-icon { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 7px; color: #173b45; background: #f3ad77; font-size: .75rem; }
    .admin-main { min-width: 0; max-width: 100%; }
    .hub-card { scroll-margin-top: 100px; }
    .hub-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .85rem; }
    .hub-heading h3 { margin-bottom: 0; }
    @media (max-width: 820px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: sticky; top: 76px; z-index: 5; padding: .6rem; }
      .admin-sidebar-title { display: none; }
      .admin-nav { display: flex; overflow-x: auto; }
      .admin-nav a { flex: 0 0 auto; }
      .admin-intro, .admin-main .hub-heading { flex-direction: column; align-items: flex-start; }
      .admin-main .toolbar { align-items: flex-start; }
      .admin-main .form-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
      .admin-main .table-responsive { max-width: 100%; overflow-x: auto; }
    }
    @media (max-width: 680px) {
      .header { align-items: stretch; flex-direction: column; gap: .75rem; }
      .user-info { justify-content: space-between; width: 100%; }
      .container { padding-top: 1.25rem; }
      .tabs { margin-left: -.25rem; margin-right: -.25rem; }
      .tab-btn { flex: 0 0 auto; padding: .65rem .8rem; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar .form-group, .search-box { width: 100%; min-width: 0 !important; max-width: none; }
      .form-grid { grid-template-columns: 1fr; }
      .admin-main .form-grid { grid-template-columns: 1fr; }
      .admin-main .btn { max-width: 100%; }
      .table-responsive { margin-left: -.25rem; width: calc(100% + .5rem); }
      th, td { padding: .75rem .65rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    let state = {
      user: null,
      activeTab: 'dashboard',
      data: { students: [], teachers: [], courses: [], batches: [], attendanceRecords: [] },
      selectedBatchId: '',
      attendanceDate: new Date().toISOString().split('T')[0],
      searchQuery: '',
      adminBatchSearch: '',
      adminUserSearch: '',
      batchStudentSearch: '',
      editingStudentId: '',
      editingTeacherId: '',
      editingBatchId: '',
      signingIn: false,
      loggingOut: false
    };

    async function api(path, options = {}) {
      options.headers = { 'Content-Type': 'application/json', ...options.headers };
      const res = await fetch(path, options);
      if (res.status === 401) {
        state.user = null;
        render();
        throw new Error('Unauthorized');
      }
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || 'Server error');
      return json;
    }

    async function initApp() {
      try {
        const { account } = await api('/api/auth/me');
        state.user = account;
        await loadState();
      } catch (_) {
        const status = await api('/api/auth/registration-status');
        state.needsAdmin = status.needsAdminSetup;
      }
      render();
    }

    async function loadState() {
      const res = await api('/api/state');
      state.data = res.state;
      if (state.data.batches.length > 0 && !state.selectedBatchId) {
        state.selectedBatchId = state.data.batches[0].id;
      }
    }

    async function saveAttendance(records) {
      const existing = state.data.attendanceRecords.filter(
        a => !(a.batch_id === state.selectedBatchId && a.date === state.attendanceDate)
      );
      state.data.attendanceRecords = [...existing, ...records];
      await api('/api/state', {
        method: 'PUT',
        body: JSON.stringify({
          state: {
            ...state.data,
            attendanceRecords: records
          }
        })
      });
      await loadState();
      alert('Attendance saved successfully!');
      render();
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      state.searchQuery = '';
      render();
    }

    function setSearch(value) {
      updateSearchState('searchQuery', value);
    }

    function setAdminUserSearch(value) {
      updateSearchState('adminUserSearch', value);
    }

    function setAdminBatchSearch(value) {
      updateSearchState('adminBatchSearch', value);
    }

    function updateSearchState(key, value) {
      const activeInput = document.activeElement;
      const caret = activeInput && typeof activeInput.selectionStart === 'number'
        ? activeInput.selectionStart
        : null;
      state[key] = String(value || '');
      render();
      const replacement = document.querySelector(`[data-search-key="${key}"]`);
      if (replacement) {
        replacement.focus();
        if (caret !== null) replacement.setSelectionRange(caret, caret);
      }
    }

    function matchesSearch(value, query) {
      return String(value || '').toLowerCase().includes(String(query || '').trim().toLowerCase());
    }

    function filterBatchStudentOptions(value) {
      state.batchStudentSearch = String(value || '');
      const query = state.batchStudentSearch.trim().toLowerCase();
      document.querySelectorAll('#batch-editor select[name="student_ids"] option').forEach(option => {
        option.hidden = Boolean(query) && !matchesSearch(option.dataset.search, query);
      });
    }

    function localDate(daysOffset = 0) {
      const date = new Date();
      date.setDate(date.getDate() + daysOffset);
      return date.toISOString().split('T')[0];
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[ch]));
    }

    // --- RENDER FUNCTIONS ---
    function render() {
      const root = document.getElementById('app');
      if (!state.user) {
        root.innerHTML = renderAuth();
        return;
      }

      root.innerHTML = `
        <div class="header">
          <h1>Attendance Hub</h1>
          <div class="user-info">
            <span><strong>${esc(state.user.name)}</strong> (${esc(state.user.role)})</span>
            <button class="btn btn-secondary" ${state.loggingOut ? 'disabled' : ''} onclick="handleLogout()">${state.loggingOut ? 'Logging out...' : 'Logout'}</button>
          </div>
        </div>
        <div class="container">
          ${state.user.role === 'admin' ? renderAdminView() : ''}
          ${state.user.role === 'teacher' ? renderTeacherView() : ''}
          ${state.user.role === 'student' ? renderStudentView() : ''}
        </div>
      `;

      if (state.user.role === 'admin') setupAdminNavigation();
    }

    function setupAdminNavigation() {
      const links = [...document.querySelectorAll('.admin-nav a')];
      const sections = links
        .map(link => document.querySelector(link.getAttribute('href')))
        .filter(Boolean);

      const setActive = sectionId => {
        links.forEach(link => {
          const active = link.getAttribute('href') === `#${sectionId}`;
          link.classList.toggle('active', active);
          if (active) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      };

      setActive('admin-overview');
      if (!('IntersectionObserver' in window)) return;

      const observer = new IntersectionObserver(entries => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (visible) setActive(visible.target.id);
      }, { rootMargin: '-110px 0px -55% 0px', threshold: 0 });

      sections.forEach(section => observer.observe(section));
    }

    function renderAuth() {
      return `
        <div class="auth-page"><div class="card auth-container">
          <div class="admin-kicker">${state.needsAdmin ? 'First-time setup' : 'Welcome back'}</div>
          <h2 style="margin-bottom: 1rem;">${state.needsAdmin ? 'Create your admin account' : 'Sign in to your workspace'}</h2>
          <p class="muted" style="margin-bottom:1.25rem;">Manage classes and attendance in one place.</p>
          <form onsubmit="handleAuth(event)">
            ${state.needsAdmin ? `
              <div class="form-group" style="margin-bottom:1rem;">
                <label>Full Name</label>
                <input class="form-control" name="name" required ${state.signingIn ? 'disabled' : ''} />
              </div>` : ''}
            <div class="form-group" style="margin-bottom:1rem;">
              <label>Email</label>
              <input type="email" class="form-control" name="email" required ${state.signingIn ? 'disabled' : ''} />
            </div>
            <div class="form-group" style="margin-bottom:1.5rem;">
              <label>Password</label>
              <input type="password" class="form-control" name="password" required ${state.signingIn ? 'disabled' : ''} />
            </div>
            <button class="btn ${state.signingIn ? 'btn-loading' : ''}" style="width:100%;" ${state.signingIn ? 'disabled' : ''}>${state.signingIn ? '<span class="spinner" aria-hidden="true"></span>Signing in...' : (state.needsAdmin ? 'Create Account' : 'Sign In')}</button>
          </form>
        </div></div>
      `;
    }

    // --- TEACHER VIEW ---
    function renderTeacherView() {
      const activeTab = state.activeTab || 'attendance';
      const batches = state.data.batches || [];
      const currentBatch = batches.find(b => b.id === state.selectedBatchId) || batches[0];

      return `
        <div class="tabs">
          <button class="tab-btn ${activeTab === 'attendance' ? 'active' : ''}" onclick="switchTab('attendance')">Mark Attendance</button>
          <button class="tab-btn ${activeTab === 'students' ? 'active' : ''}" onclick="switchTab('students')">Student Roster</button>
          <button class="tab-btn ${activeTab === 'history' ? 'active' : ''}" onclick="switchTab('history')">Attendance History</button>
          <button class="tab-btn ${activeTab === 'batches' ? 'active' : ''}" onclick="switchTab('batches')">Manage Batches</button>
        </div>
        ${activeTab === 'batches' ? renderTeacherBatchTab() : batches.length === 0 ? '<div class="card"><p>No batches assigned to your profile.</p></div>' : `
          <div class="card">
            <div class="form-grid">
              <div class="form-group">
                <label>Select Active Batch</label>
                <select class="form-control" onchange="state.selectedBatchId=this.value; state.searchQuery=''; render();">
                  ${batches.map(b => `<option value="${esc(b.id)}" ${b.id === currentBatch?.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
                </select>
              </div>
              ${activeTab === 'attendance' ? `
                <div class="form-group">
                  <label>Attendance date</label>
                  <input type="date" class="form-control" min="${localDate(-7)}" max="${localDate()}" value="${esc(state.attendanceDate)}" onchange="state.attendanceDate=this.value; render();" />
                  <span class="date-help">Today or any of the previous 7 days.</span>
                </div>` : ''}
            </div>
          </div>
          ${activeTab === 'attendance' ? renderTeacherAttendanceTab(currentBatch) : ''}
          ${activeTab === 'students' ? renderTeacherStudentsTab(currentBatch) : ''}
          ${activeTab === 'history' ? renderTeacherHistoryTab(currentBatch) : ''}
        `}
      `;
    }

    function renderTeacherBatchTab() {
      const batches = state.data.batches || [];
      const editing = batches.find(batch => batch.id === state.editingBatchId);
      const studentIds = editing?.student_ids || [];
      return `
        <div class="card">
          <div class="hub-heading"><div><h3>${editing ? 'Edit batch' : 'Create a batch'}</h3><span class="muted">Build a class and add students to it. New batches are assigned to you automatically.</span></div><span class="badge badge-present">${batches.length} batch(es)</span></div>
          <form onsubmit="${editing ? `handleUpdateTeacherBatch(event, '${esc(editing.id)}')` : 'handleCreateTeacherBatch(event)'}">

    function renderTeacherAttendanceTab(batch) {
      if (!batch) return '';
      const query = state.searchQuery.trim().toLowerCase();
      const allStudents = state.data.students.filter(s => (batch.student_ids || []).includes(s.id));
      const students = allStudents.filter(s => !query || matchesSearch(`${s.id} ${s.name} ${s.email}`, query));
      const existingRecords = state.data.attendanceRecords.filter(a => a.batch_id === batch.id && a.date === state.attendanceDate);
      const attendanceLocked = existingRecords.length > 0;

      return `
        <div class="card">
          <div class="toolbar">
            <div><h3>Mark Attendance: ${esc(batch.name)}</h3><span class="muted">Enrolled: ${allStudents.length} · Showing: ${students.length}</span></div>
            <div class="form-group search-box"><label>Search student</label>
              <input class="form-control" data-search-key="searchQuery" value="${esc(state.searchQuery)}" placeholder="ID, name or email" oninput="setSearch(this.value)" />
            </div>
          </div>
          <form onsubmit="handleTeacherSubmitAttendance(event, '${esc(batch.id)}')">
            <div class="form-group lecture-field"><label>Lecture name <span class="muted">(optional)</span></label>
              <input class="form-control" name="lecture_name" value="${esc(existingRecords[0]?.lecture_name || '')}" maxlength="120" placeholder="e.g. Algebra: Linear equations" ${attendanceLocked ? 'disabled' : ''} />
            </div>
            <div class="table-responsive">
              <table>
                <thead><tr><th>Student ID</th><th>Name</th><th>Status</th></tr></thead>
                <tbody>
                  ${students.length ? students.map(s => {
                    const record = existingRecords.find(r => r.student_id === s.id);
                    const isPresent = record ? record.status === 'present' : true;
                    return `<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>
                      <select class="form-control" name="status_${esc(s.id)}" ${attendanceLocked ? 'disabled' : ''}>
                        <option value="present" ${isPresent ? 'selected' : ''}>Present</option>
                        <option value="absent" ${!isPresent ? 'selected' : ''}>Absent</option>
                      </select></td></tr>`;
                  }).join('') : '<tr><td colspan="3" class="empty">No matching students.</td></tr>'}
                </tbody>
              </table>
            </div>
            ${attendanceLocked ? '<p class="date-help">Attendance is locked because this session was already saved.</p>' : (allStudents.length ? '<button class="btn" style="margin-top:1rem;">Save Attendance</button>' : '')}
          </form>
        </div>`;
    }

    function renderTeacherStudentsTab(batch) {
      if (!batch) return '';
      const query = state.searchQuery.trim().toLowerCase();
      const students = state.data.students

      return `
        <div class="card">
          <div class="toolbar">
            <div><h3>Enrolled Students for ${esc(batch.name)}</h3><span class="muted">${students.length} matching student(s)</span></div>

    function renderTeacherHistoryTab(batch) {
      if (!batch) return '';
      const query = state.searchQuery.trim().toLowerCase();
      const records = state.data.attendanceRecords
        .filter(a => a.batch_id === batch.id)
        .filter(r => {
          const s = state.data.students.find(x => x.id === r.student_id);
          return !query || matchesSearch(`${r.date} ${r.lecture_name || ''} ${r.student_id} ${s?.name || ''} ${r.status}`, query);

      return `

      return `

                    .sort((a,b) => b.date.localeCompare(a.date))
                    .map(r => {

              <input class="form-control" data-search-key="adminBatchSearch" value="${esc(state.adminBatchSearch)}" placeholder="Batch name, ID, course or teacher" oninput="setAdminBatchSearch(this.value)" />

              const teachers = (b.teacher_ids || []).map(id => state.data.teachers.find(t => t.id === id)?.name || id).join(', ');
              return `<tr><td><strong>${esc(b.name)}</strong><br><span class="muted">${esc(b.id)}</span></td>

    // --- HANDLERS ---
    async function handleAuth(e) {
      e.preventDefault();
      if (state.signingIn) return;
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      const endpoint = state.needsAdmin ? '/api/auth/register-first-admin' : '/api/auth/login';
      state.signingIn = true;
      render();
      try {
        const res = await api(endpoint, { method: 'POST', body: JSON.stringify(data) });
        state.user = res.account;
        state.needsAdmin = false;
        await loadState();
      } catch (err) {
        alert(err.message);
      } finally {
        state.signingIn = false;
        render();
      }
    }

    async function handleLogout() {
      if (state.loggingOut) return;
      state.loggingOut = true;
      render();
      try {
        await api('/api/auth/logout', { method: 'POST' });
        state.user = null;
      } catch (err) {
        alert(err.message);
      } finally {
        state.loggingOut = false;
        render();
      }
    }

    async function handleTeacherSubmitAttendance(e, batchId) {
      e.preventDefault();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const selected = new Date(`${state.attendanceDate}T00:00:00`);
      const earliest = new Date(today);
      earliest.setDate(earliest.getDate() - 7);
      if (!state.attendanceDate || selected < earliest || selected > today) {
        alert('Attendance can be marked only for today or the previous 7 days.');
        return;
      }
      if (state.data.attendanceRecords.some(record =>
        record.batch_id === batchId && record.date === state.attendanceDate
      )) {
        alert('Attendance for this batch and date is already locked.');
        return;
      }
      const fd = new FormData(e.target);
      const batch = state.data.batches.find(b => b.id === batchId);
      const studentIds = batch ? batch.student_ids || [] : [];
      
      const newRecords = studentIds.map(sId => ({
        batch_id: batchId,
        student_id: sId,
        date: state.attendanceDate,
        lecture_name: String(fd.get('lecture_name') || '').trim(),
        status: fd.get(`status_${sId}`) || 'present'
      }));

      await saveAttendance(newRecords);
    }

    function csvValue(value) {
      return `"${String(value ?? '').replace(/"/g, '""')}"`;
    }

    function downloadCsv(filename, rows) {
      const csv = rows.map(row => row.map(csvValue).join(',')).join('\n');
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function exportBatchAttendance(batchId) {
      const batch = state.data.batches.find(item => item.id === batchId);
      if (!batch) return;
      const rows = [['Date', 'Lecture', 'Student ID', 'Student name', 'Email', 'Status']];
      state.data.attendanceRecords
        .filter(record => record.batch_id === batchId)
        .sort((a, b) => `${a.date}${a.student_id}`.localeCompare(`${b.date}${b.student_id}`))
        .forEach(record => {
          const student = state.data.students.find(item => item.id === record.student_id);
          rows.push([record.date, record.lecture_name || '', record.student_id, student?.name || '', student?.email || '', record.status]);
        });
      downloadCsv(`${batch.name}-attendance.csv`, rows);
    }

    function exportBatchStudents(batchId) {
      const batch = state.data.batches.find(item => item.id === batchId);
      if (!batch) return;
      const rows = [['Student ID', 'Name', 'Email']];
      (batch.student_ids || []).forEach(studentId => {
        const student = state.data.students.find(item => item.id === studentId);
        rows.push([studentId, student?.name || '', student?.email || '']);
      });
      downloadCsv(`${batch.name}-students.csv`, rows);
    }
